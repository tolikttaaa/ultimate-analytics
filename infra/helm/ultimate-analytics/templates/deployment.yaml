apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ultimate-analytics.fullname" . }}
  labels:
    {{- include "ultimate-analytics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # The raw-file volume is ReadWriteOnce: stop the old pod before the new one mounts it.
    type: Recreate
  selector:
    matchLabels:
      {{- include "ultimate-analytics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ultimate-analytics.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: {{ include "ultimate-analytics.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: server
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: optional:file:/config/
            {{- include "ultimate-analytics.databaseEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "ultimate-analytics.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: raw-files
              mountPath: /data/raw
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "ultimate-analytics.fullname" . }}-config
        - name: raw-files
          persistentVolumeClaim:
            claimName: {{ include "ultimate-analytics.fullname" . }}-raw-files
        - name: tmp
          emptyDir: {}
