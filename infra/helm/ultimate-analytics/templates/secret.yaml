{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ultimate-analytics.secretName" . }}
  labels:
    {{- include "ultimate-analytics.labels" . | nindent 4 }}
  annotations:
    # Created before the migration Job, which needs the credentials already on the first install.
    # Hook resources are not removed by `helm uninstall`; prefer database.existingSecret.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ .Values.database.usernameKey }}: {{ required "database.username is required without database.existingSecret" .Values.database.username | quote }}
  {{ .Values.database.passwordKey }}: {{ required "database.password is required without database.existingSecret" .Values.database.password | quote }}
{{- end }}
