# Example values for a server deployment. Copy to values-server.yaml (not committed) and adjust.
# Credentials never go into this file: create the Secret beforehand, e.g.
#   kubectl create secret generic ultimate-analytics-db --from-literal=username=... --from-literal=password=...

image:
  repository: ghcr.io/tolikttaaa/ultimate-analytics
  tag: "0.1.0"

database:
  url: jdbc:postgresql://postgres.example.internal:5432/ultimate
  existingSecret: ultimate-analytics-db

storage:
  size: 10Gi

ingress:
  enabled: true
  className: nginx
  host: analytics.example.com
  tls:
    enabled: true
    secretName: analytics-example-com-tls
