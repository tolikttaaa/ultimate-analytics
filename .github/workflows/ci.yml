name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6
      # Compiles and runs all tests; the integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      # helm lint and helm template with the example values (spec 7.5)
      - run: ./infra/scripts/helm-check.sh
