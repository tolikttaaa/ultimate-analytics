# Defaults only (spec 7.5): no hostnames, credentials or other environment-specific values.
# Environments add infra/config/application-<profile>.yml and environment variables.
spring:
  application:
    name: ultimate-analytics
  datasource:
    hikari:
      data-source-properties:
        # Lets the PostgreSQL driver turn batched sample inserts into multi-row inserts.
        reWriteBatchedInserts: true
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    # Errors as RFC 7807 application/problem+json (spec 9)
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Hard ceilings for a whole upload request; the per-file limit is app.upload.max-file-size, reported per file.
      max-file-size: 200MB
      max-request-size: 500MB
  flyway:
    # Migrations come from the infra:db-migrations jar (classpath:db/migration).
    # Disabled where a separate migration job runs them (future server profile).
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  storage:
    # RawFileStore implementation (spec 7.5, 8.3)
    type: filesystem
    raw-dir: ./storage/raw
  upload:
    # Per-file limit, also for each .fit inside a .zip
    max-file-size: 20MB
  analysis:
    # Maximum heart rate for the HR zones (spec 6.2)
    hr-max: 190
  map:
    # Base maps of the frontend (spec 10.2), served by GET /api/config. OpenFreeMap: free, no key, attribution shown
    # by MapLibre.
    vector-style-url: https://tiles.openfreemap.org/styles/liberty
    satellite:
      # XYZ raster tiles with {z}/{x}/{y}, usually with a provider key: set APP_MAP_SATELLITE_TILES_URL per
      # environment, never commit it. Empty: no satellite base map.
      tiles-url: ""
      attribution: ""
      max-zoom: 19
      tile-size: 256

springdoc:
  # Stable key order, so the OpenAPI snapshot the frontend types are generated from only changes with the API.
  writer-with-order-by-keys: true
