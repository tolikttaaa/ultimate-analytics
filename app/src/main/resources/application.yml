# Defaults only (spec 7.5): no hostnames, credentials or other environment-specific values.
# Environments add infra/config/application-<profile>.yml and environment variables.
spring:
  application:
    name: ultimate-analytics
  datasource:
    hikari:
      data-source-properties:
        # Lets the PostgreSQL driver turn batched sample inserts into multi-row inserts.
        reWriteBatchedInserts: true
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    # Migrations come from the infra:db-migrations jar (classpath:db/migration).
    # Disabled where a separate migration job runs them (future server profile).
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  storage:
    # RawFileStore implementation (spec 7.5, 8.3)
    type: filesystem
    raw-dir: ./storage/raw
  upload:
    # Per-file limit, also for each .fit inside a .zip
    max-file-size: 20MB
  analysis:
    # Maximum heart rate for the HR zones (spec 6.2)
    hr-max: 190
